name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/Aspire.Community.ApachePulsar/Aspire.Community.ApachePulsar.csproj --configuration Release

      - name: Pack
        run: >
          dotnet pack src/Aspire.Community.ApachePulsar/Aspire.Community.ApachePulsar.csproj
          --configuration Release
          --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./nupkg

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
